<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiveFut TV - Accedi</title>
  <script src="https://app.termly.io/resource-blocker/ecfeb307-3d9a-4e26-a7de-4dab9c2345f9?autoBlock=on"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#060a0f;--bg2:#080d14;--bg3:#0a1018;--accent:#00c8ff;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.22);--text:#e8f4ff;--muted:#5a8aaa;--muted2:#3a5a6a;--radius:8px;--radius-lg:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}

    .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .page-bg svg{width:100%;height:100%;}

    .topbar{position:relative;z-index:10;background:rgba(6,10,15,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;min-height:60px;}
    .logo-live{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;}
    .logo-fut{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#00c8ff;}
    .logo-tv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#00c8ff;font-style:italic;margin-left:2px;opacity:0.8;}
    .back-link{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
    .back-link:hover{color:#00c8ff;}

    .main{flex:1;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}

    .login-wrap{width:100%;max-width:420px;}

    .login-header{text-align:center;margin-bottom:28px;}
    .login-header .badge{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:2px;color:#00c8ff;border:1px solid var(--border2);padding:5px 12px;border-radius:20px;text-transform:uppercase;background:rgba(0,200,255,0.05);margin-bottom:14px;}
    .login-header h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:-0.5px;margin-bottom:6px;}
    .login-header p{font-size:13px;color:var(--muted);}

    .login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);overflow:hidden;}

    .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
    .tab{padding:14px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;background:transparent;border:none;font-family:'Barlow',sans-serif;}
    .tab.active{color:#00c8ff;border-bottom:2px solid #00c8ff;}
    .tab:hover{color:var(--text);}

    .panel-body{padding:24px;}
    .panel-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:#fff;text-transform:uppercase;margin-bottom:4px;}
    .panel-desc{font-size:12px;color:var(--muted);margin-bottom:20px;}

    .social-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
    .social-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;font-weight:700;padding:9px 8px;cursor:pointer;font-family:'Barlow',sans-serif;transition:border-color 0.2s;}
    .social-btn:hover{border-color:#00c8ff;color:#00c8ff;}

    .divider{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .divider span{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;}

    .form-group{margin-bottom:12px;}
    .form-group label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
    .form-group input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color 0.2s;}
    .form-group input:focus{border-color:#00c8ff;}
    .form-group input::placeholder{color:var(--muted2);}

    .form-check{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
    .form-check input{width:auto;margin-top:2px;accent-color:#00c8ff;}
    .form-check label{font-size:12px;color:var(--muted);line-height:1.5;}
    .form-check a{color:#00c8ff;}

    .btn{display:block;width:100%;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:14px;padding:11px 20px;border-radius:var(--radius);transition:all 0.2s;text-align:center;}
    .btn-primary{background:#00c8ff;color:#060a0f;}
    .btn-primary:hover{background:#22ddff;}

    .recover-link{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;cursor:pointer;}
    .recover-link span{color:#00c8ff;cursor:pointer;}

    .recover-panel{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
    .recover-panel.show{display:block;}
    .recover-panel label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block;}
    .recover-panel input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color 0.2s;margin-bottom:10px;}
    .recover-panel input:focus{border-color:#00c8ff;}
    .recover-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:#00c8ff;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:9px 16px;cursor:pointer;width:100%;}

    .form-panel{display:none;}
    .form-panel.active{display:block;}

    .status{display:none;font-size:13px;padding:10px 12px;border-radius:var(--radius);margin-top:12px;}
    .status.show{display:block;}
    .status.ok{background:rgba(0,200,100,0.1);color:#00cc66;border:1px solid rgba(0,200,100,0.2);}
    .status.error{background:rgba(220,40,10,0.1);color:#ff5533;border:1px solid rgba(220,40,10,0.2);}

    footer{position:relative;z-index:1;text-align:center;padding:20px;font-size:12px;color:var(--muted2);}
    footer a{color:var(--muted);}
  </style>
</head>
<body>

<div class="page-bg">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
    <defs>
      <radialGradient id="glow-login" cx="50%" cy="50%" r="40%">
        <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="720" cy="450" rx="400" ry="260" fill="url(#glow-login)"/>
    <rect x="120" y="60" width="1200" height="780" stroke="#00c8ff" stroke-width="1.5" opacity="0.07"/>
    <line x1="720" y1="60" x2="720" y2="840" stroke="#00c8ff" stroke-width="1" opacity="0.07"/>
    <circle cx="720" cy="450" r="110" stroke="#00c8ff" stroke-width="1" opacity="0.07"/>
    <rect x="120" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.06"/>
    <rect x="120" y="330" width="80" height="180" stroke="#00c8ff" stroke-width="1" opacity="0.06"/>
    <rect x="1100" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.06"/>
    <rect x="1340" y="330" width="80" height="180" stroke="#00c8ff" stroke-width="1" opacity="0.06"/>
    <rect x="94" y="390" width="26" height="120" stroke="#00c8ff" stroke-width="1" opacity="0.05"/>
    <rect x="1320" y="390" width="26" height="120" stroke="#00c8ff" stroke-width="1" opacity="0.05"/>
  </svg>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html">
      <span class="logo-live">LIVE</span><span class="logo-fut">FUT</span><span class="logo-tv">.TV</span>
    </a>
    <a href="index.html" class="back-link">← Torna alla home</a>
  </div>
</header>

<main class="main">
  <div class="login-wrap">
    <div class="login-header">
      <div class="badge">⚡ Accesso piattaforma</div>
      <h1 id="panelHeading">Bentornato</h1>
      <p id="panelDescription">Accedi con la tua email per entrare nella piattaforma LiveFut TV.</p>
    </div>

    <div class="login-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Accedi</button>
        <button class="tab" data-tab="register">Registrati</button>
      </div>

      <div class="panel-body">

        <div class="social-btns">
          <button class="social-btn" type="button" data-oauth-provider="google">Google</button>
          <button class="social-btn" type="button" data-oauth-provider="facebook">Facebook</button>
          <button class="social-btn" type="button" data-oauth-provider="twitch">Twitch</button>
        </div>

        <div class="divider"><span>oppure</span></div>

        <!-- Login -->
        <div id="loginForm" class="form-panel active">
          <div class="form-group">
            <label>Email</label>
            <input id="loginEmail" type="email" placeholder="la-tua@email.com" required/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="••••••••" required/>
          </div>
          <button class="btn btn-primary" type="button" id="loginSubmit">Accedi</button>
          <div class="recover-link" id="recoverToggle">Hai dimenticato la password? <span>Recuperala</span></div>
          <div class="recover-panel" id="recoverPanel">
            <label>Email per il recupero</label>
            <input id="resetEmail" type="email" placeholder="la-tua@email.com"/>
            <button class="recover-btn" id="resetSubmitBtn">Invia email di recupero</button>
          </div>
        </div>

        <!-- Register -->
        <div id="registerForm" class="form-panel">
          <div class="form-group">
            <label>Nome profilo</label>
            <input id="registerName" type="text" placeholder="Il tuo nome" required/>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input id="registerEmail" type="email" placeholder="la-tua@email.com" required/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input id="registerPassword" type="password" placeholder="min. 6 caratteri" required/>
          </div>
          <div class="form-check">
            <input id="privacyConsent" type="checkbox"/>
            <label for="privacyConsent">Dichiaro di aver letto e accettato la <a href="https://www.iubenda.com/privacy-policy/71949704">Privacy Policy</a>, la <a href="https://www.iubenda.com/privacy-policy/71949704/cookie-policy">Cookie Policy</a> e i <a href="terms.html">Termini e Condizioni</a>.</label>
          </div>
          <button class="btn btn-primary" type="button" id="registerSubmit">Crea account</button>
        </div>

        <!-- Nuova password -->
        <div id="newPasswordForm" class="form-panel">
          <div class="form-group">
            <label>Nuova password</label>
            <input id="newPassword" type="password" placeholder="min. 6 caratteri" required/>
          </div>
          <button class="btn btn-primary" type="button" id="newPasswordSubmit">Aggiorna password</button>
        </div>

        <div id="statusBox" class="status"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <a href="https://www.iubenda.com/privacy-policy/71949704">Privacy</a> |
  <a href="https://www.iubenda.com/privacy-policy/71949704/cookie-policy">Cookie</a> |
  <a href="terms.html">Termini</a>
</footer>

<script>
  const SUPABASE_URL='https://obiiemjaxmgqeavrkxdc.supabase.co';
  const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaWllbWpheG1ncWVhdnJreGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDM2OTgsImV4cCI6MjA5MjUxOTY5OH0.m_dkQYPSrj70u1LFC11vOafaU1oN8P7G6AN_qHMr69k';
  const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const APP_BASE_URL=window.location.hostname==='localhost'?'https://livefut-site1.vercel.app':window.location.origin;
  const loginParams=new URLSearchParams(window.location.search);
  const redirectTarget=sanitizeRedirectTarget(loginParams.get('redirect'));
  const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,''));
  const authType=loginParams.get('type')||hashParams.get('type');
  const loginTab=document.querySelector('[data-tab="login"]');
  const registerTab=document.querySelector('[data-tab="register"]');
  const loginForm=document.getElementById('loginForm');
  const registerForm=document.getElementById('registerForm');
  const newPasswordForm=document.getElementById('newPasswordForm');
  const recoverPanel=document.getElementById('recoverPanel');
  const recoverToggle=document.getElementById('recoverToggle');
  const resetSubmitBtn=document.getElementById('resetSubmitBtn');
  const panelHeading=document.getElementById('panelHeading');
  const panelDescription=document.getElementById('panelDescription');
  const statusBox=document.getElementById('statusBox');

  function sanitizeRedirectTarget(value){
    if(!value)return'live.html';
    try{
      const decoded=decodeURIComponent(value);
      const target=new URL(decoded,window.location.origin);
      const allowed=new Set(['dashboard.html','live.html','match.html','studio.html','create-match.html','tournaments.html','archiviopartite.html','profile.html','admin.html','index.html']);
      const page=target.pathname.split('/').pop();
      if(target.origin!==window.location.origin||!allowed.has(page))return'live.html';
      return`${page}${target.search}${target.hash}`;
    }catch(e){return'dashboard.html';}
  }
  function authRedirectUrl(target=redirectTarget){return`${APP_BASE_URL}/login.html?redirect=${encodeURIComponent(target)}`;}
  async function ensureProfile(user){
    if(!user)return;
    const displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'Utente LiveFut';
    const{data:existing}=await supabaseClient.from('profiles').select('id').eq('id',user.id).maybeSingle();
    if(existing){await supabaseClient.from('profiles').update({email:user.email,display_name:displayName,privacy_accepted:Boolean(user.user_metadata?.privacy_accepted)}).eq('id',user.id);return;}
    await supabaseClient.from('profiles').insert({id:user.id,email:user.email,display_name:displayName,role:'user',privacy_accepted:Boolean(user.user_metadata?.privacy_accepted)});
  }
  function showStatus(msg,type='ok'){statusBox.textContent=msg;statusBox.className=`status show ${type}`;}
  function clearStatus(){statusBox.className='status';statusBox.textContent='';}
  function setTab(tab){
    clearStatus();
    if(tab==='login'){
      loginTab.classList.add('active');registerTab.classList.remove('active');
      loginForm.classList.add('active');registerForm.classList.remove('active');newPasswordForm.classList.remove('active');
      recoverPanel.classList.remove('show');
      panelHeading.textContent='Bentornato';
      panelDescription.textContent='Accedi con la tua email per entrare nella piattaforma LiveFut TV.';
    }else if(tab==='register'){
      registerTab.classList.add('active');loginTab.classList.remove('active');
      registerForm.classList.add('active');loginForm.classList.remove('active');newPasswordForm.classList.remove('active');
      panelHeading.textContent='Crea il tuo account';
      panelDescription.textContent='Registrati per entrare nella piattaforma LiveFut TV.';
    }else if(tab==='new-password'){
      loginTab.classList.remove('active');registerTab.classList.remove('active');
      loginForm.classList.remove('active');registerForm.classList.remove('active');newPasswordForm.classList.add('active');
      panelHeading.textContent='Imposta nuova password';
      panelDescription.textContent='Inserisci una nuova password per completare il recupero dell\'account.';
    }
  }
  loginTab.addEventListener('click',()=>setTab('login'));
  registerTab.addEventListener('click',()=>setTab('register'));
  document.querySelectorAll('[data-oauth-provider]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      clearStatus();
      const{error}=await supabaseClient.auth.signInWithOAuth({provider:btn.dataset.oauthProvider,options:{redirectTo:authRedirectUrl(redirectTarget)}});
      if(error)showStatus(error.message,'error');
    });
  });
  recoverToggle.addEventListener('click',()=>{clearStatus();recoverPanel.classList.toggle('show');});
  async function smartRedirect(user, explicitTarget) {
    // Se c'era un redirect esplicito (es. da partita) rispettalo
    if (explicitTarget && explicitTarget !== 'live.html' && explicitTarget !== 'dashboard.html') {
      return explicitTarget;
    }
    // Controlla se il profilo è già compilato (username o city presenti)
    try {
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('onboarding_seen')
        .eq('id', user.id)
        .single();
      return profile?.onboarding_seen === true ? 'live.html' : 'live.html?onboarding=1';
    } catch(e) {
      return 'live.html';
    }
  }

  document.getElementById('loginSubmit').addEventListener('click',async()=>{
    clearStatus();
    const email=document.getElementById('loginEmail').value.trim();
    const password=document.getElementById('loginPassword').value.trim();
    const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){showStatus(error.message,'error');return;}
    await ensureProfile(data.user);
    window.location.href=await smartRedirect(data.user,redirectTarget);
  });
  document.getElementById('registerSubmit').addEventListener('click',async()=>{
    clearStatus();
    const displayName=document.getElementById('registerName').value.trim();
    const email=document.getElementById('registerEmail').value.trim();
    const password=document.getElementById('registerPassword').value.trim();
    const privacyConsent=document.getElementById('privacyConsent').checked;
    if(!privacyConsent){showStatus('Devi accettare Privacy Policy, Cookie Policy e Termini e Condizioni.','error');return;}
    const{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:authRedirectUrl(redirectTarget),data:{display_name:displayName,privacy_accepted:true}}});
    if(error){showStatus(error.message,'error');return;}
    if(data.session&&data.user){
      await ensureProfile(data.user);
      window.location.href=await smartRedirect(data.user,redirectTarget);
      return;
    }
    showStatus('Account creato. Controlla la tua email e conferma la registrazione.');
    setTab('login');
  });
  resetSubmitBtn.addEventListener('click',async()=>{
    clearStatus();
    const email=document.getElementById('resetEmail').value.trim();
    if(!email){showStatus('Inserisci la tua email.','error');return;}
    const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:`${APP_BASE_URL}/login.html?type=recovery&redirect=${encodeURIComponent(redirectTarget)}`});
    if(error){showStatus(error.message,'error');return;}
    showStatus('Email di recupero inviata. Apri il link ricevuto.');
  });
  document.getElementById('newPasswordSubmit').addEventListener('click',async()=>{
    clearStatus();
    const password=document.getElementById('newPassword').value.trim();
    if(password.length<6){showStatus('La password deve avere almeno 6 caratteri.','error');return;}
    const{error}=await supabaseClient.auth.updateUser({password});
    if(error){showStatus(error.message,'error');return;}
    showStatus('Password aggiornata. Accesso in corso...');
    setTimeout(()=>{window.location.href=redirectTarget;},900);
  });
  supabaseClient.auth.getSession().then(async({data})=>{
    if(authType==='recovery'){setTab('new-password');return;}
    if(data.session){
      await ensureProfile(data.session.user);
      if(loginParams.get('redirect')){
        window.location.href=await smartRedirect(data.session.user,redirectTarget);
      } else {
        window.location.href=await smartRedirect(data.session.user,'live.html');
      }
    }
  });
</script>
<script src="https://cdn.iubenda.com/iubenda.js"></script>
</body>
</html>
