<html lang="it">

  <style>
    :root{--bg:#060a0f;--bg2:#080d14;--bg3:#0a1018;--accent:#00c8ff;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.22);--text:#e8f4ff;--muted:#5a8aaa;--muted2:#3a5a6a;--radius:8px;--radius-lg:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    .container{width:min(1180px,calc(100% - 32px));margin:0 auto;}
    .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .page-bg svg{width:100%;height:100%;}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(6,10,15,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;}
    .logo-live{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;}
    .logo-fut{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#00c8ff;}
    .logo-tv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#00c8ff;font-style:italic;margin-left:2px;opacity:0.8;}
    .nav{display:flex;gap:14px;}
    .nav a{font-size:13px;font-weight:600;color:var(--muted);transition:color 0.2s;}
    .nav a:hover{color:#00c8ff;}
    .btn{display:inline-flex;align-items:center;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:8px 16px;border-radius:var(--radius);transition:all 0.2s;}
    .btn-secondary{background:transparent;color:#00c8ff;border:1px solid var(--border2);}
    main{position:relative;z-index:1;padding:32px 0 48px;}
    .page-tag{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px;}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:#fff;text-transform:uppercase;margin:0 0 6px;}
    p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:28px;}
    .stat{padding:16px;text-align:center;border-right:1px solid var(--border);}
    .stat:last-child{border-right:none;}
    .stat strong{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:#00c8ff;display:block;}
    .stat span{font-size:11px;color:var(--muted);letter-spacing:0.5px;}
    .archive-area{display:grid;gap:14px;} 
    .region-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
    .region-header{padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#fff;text-transform:uppercase;}
    .region-header:hover{background:rgba(0,200,255,0.04);}
    .region-body{padding:0 18px 14px;display:none;}
    .region-body.open{display:block;}
    .comp-group{margin-bottom:14px;}
    .comp-name{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:10px 0 8px;}
    .match-card{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .match-card:last-child{border-bottom:none;}
    .match-teams{font-weight:700;color:var(--text);}
    .match-score{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#00c8ff;}
    .match-date{font-size:11px;color:var(--muted2);}
    .empty-msg{padding:28px;text-align:center;color:var(--muted2);font-size:13px;border:1px dashed rgba(0,200,255,0.1);border-radius:var(--radius-lg);}
    footer{position:relative;z-index:1;text-align:center;padding:20px;font-size:12px;color:var(--muted2);border-top:1px solid var(--border);}
    footer a{color:var(--muted);}
    @media(max-width:820px){.nav{display:none;}}
  </style>
</head>
<body>
<div class="page-bg"><svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none"><defs><radialGradient id="gp"><stop offset="0%" stop-color="#00c8ff" stop-opacity="0.07"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="720" cy="450" rx="420" ry="270" fill="url(#gp)"/><rect x="120" y="60" width="1200" height="780" stroke="#00c8ff" stroke-width="1.5" opacity="0.06"/><line x1="720" y1="60" x2="720" y2="840" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><circle cx="720" cy="450" r="110" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="120" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="1100" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/></svg></div>
<header class="topbar"><div class="container topbar-inner">
  <a href="index.html"><span class="logo-live">LIVE</span><span class="logo-fut">FUT</span><span class="logo-tv">.TV</span></a>
  <nav class="nav"><a href="index.html">Home</a><a href="live.html">Live</a><a href="dashboard.html">Dashboard</a></nav>
  <div style="display:flex;gap:8px">
    <a class="btn btn-secondary" href="live.html">← Live</a>
    <a class="btn btn-secondary" href="dashboard.html">Dashboard</a>
  </div>
</div></header>
<main><div class="container">
  <div style="margin-bottom:6px"><span style="font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted2);text-transform:uppercase">Archivio LiveFut</span></div>
  <h1>Partite archiviate</h1>
  <p>Consulta le partite con data già passata, ordinate per regione e competizione.</p>
  <div class="stats-row">
    <div class="stat"><strong id="statTotal">0</strong><span>Partite archiviate</span></div>
    <div class="stat"><strong id="statRegioni">0</strong><span>Regioni</span></div>
    <div class="stat"><strong id="statComp">0</strong><span>Competizioni</span></div>
  </div>
  <div id="archiveArea" class="archive-area">
    <div class="empty-msg">Nessuna partita archiviata al momento.</div>
  </div>
</div></main>
<footer>&copy; 2026 LiveFut TV — <a href="https://www.iubenda.com/privacy-policy/71949704">Privacy</a> | <a href="terms.html">Termini</a></footer>
<script>
const SUPABASE_URL = 'https://obiiemjaxmgqeavrkxdc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaWllbWpheG1ncWVhdnJreGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDM2OTgsImV4cCI6MjA5MjUxOTY5OH0.m_dkQYPSrj70u1LFC11vOafaU1oN8P7G6AN_qHMr69k';
    const OFFICIAL_DATA_URL = 'data/italia_2025_26_api.json';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const archiveRoot = document.getElementById('archiveRoot');
    const emptyState = document.getElementById('emptyState');
    const archivedMatchesCount = document.getElementById('archivedMatchesCount');
    const archivedRegionsCount = document.getElementById('archivedRegionsCount');
    const archivedCompetitionsCount = document.getElementById('archivedCompetitionsCount');

    function safe(value, fallback = '-') {
      return value === null || value === undefined || value === '' ? fallback : value;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function parseLocalDate(dateValue) {
      if (!dateValue) return null;
      const [year, month, day] = String(dateValue).split('-').map(Number);
      if (!year || !month || !day) return null;
      return new Date(year, month - 1, day);
    }

    function formatDate(dateValue) {
      const date = parseLocalDate(dateValue);
      if (!date) return 'Data non disponibile';
      return date.toLocaleDateString('it-IT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    function formatDiscipline(value) {
      if (value === 'calcio_a_5') return 'Calcio a 5';
      if (value === 'calcio_a_8') return 'Calcio a 8';
      if (value === 'calcio_a_11') return 'Calcio a 11';
      return safe(value, 'Calcio');
    }

    function sportFromDiscipline(value) {
      const text = String(value || '').toLowerCase();
      if (text.includes('5')) return 'calcio_a_5';
      if (text.includes('8')) return 'calcio_a_8';
      return 'calcio_a_11';
    }

    function normalizeScore(score) {
      const value = String(score || '').trim();
      if (!value) return 'Risultato non disponibile';
      return value.replace('-', ' - ');
    }

    function isArchivedMatch(match) {
      if (match.source === 'archived') return true;

      const date = parseLocalDate(match.match_date);
      if (!date) return match.status === 'finished';

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      date.setHours(0, 0, 0, 0);

      return date < today;
    }

    function officialMatchToCard(match) {
      return {
        id: match.match_id,
        match_id: match.match_id,
        competition_id: match.competition_id,
        region: match.region,
        discipline: formatDiscipline(match.sport),
        sport: match.sport,
        competition_type: match.competition_type,
        category: match.category,
        group_name: match.group_name,
        match_date: match.match_date,
        home_team: match.home_team,
        away_team: match.away_team,
        score: '',
        status: match.status || 'finished',
        source: 'lnd'
      };
    }

    function normalizeSupabaseMatch(match) {
      const sport = match.sport || sportFromDiscipline(match.discipline);
      return {
        ...match,
        id: match.id || match.match_id,
        match_id: match.match_id || match.id,
        region: match.region || '',
        discipline: match.discipline || formatDiscipline(sport),
        sport,
        category: match.category,
        group_name: match.group_name,
        match_date: match.match_date,
        score: match.score,
        status: match.status || 'finished',
        source: match.source || 'supabase'
      };
    }

    function mergeMatches(officialMatches, liveRows) {
      const byId = new Map();
      officialMatches.forEach(match => byId.set(match.match_id, match));

      liveRows.forEach(row => {
        const liveMatch = normalizeSupabaseMatch(row);
        const key = liveMatch.match_id || liveMatch.id;
        if (key && byId.has(key)) {
          byId.set(key, { ...byId.get(key), ...liveMatch, source: 'merged' });
        } else if (key) {
          byId.set(key, liveMatch);
        }
      });

      return Array.from(byId.values()).sort((a, b) => {
        return String(b.match_date || '').localeCompare(String(a.match_date || '')) ||
          String(a.home_team).localeCompare(String(b.home_team), 'it');
      });
    }

    function buildCompetitionMap(competitions, liveRows) {
      const map = new Map();

      competitions.forEach(competition => {
        map.set(competition.competition_id, {
          category: competition.category,
          group_name: competition.group_name,
          sport: competition.sport,
          region: competition.region
        });
      });

      liveRows.forEach(row => {
        if (!row.competition_id || map.has(row.competition_id)) return;
        const sport = row.sport || sportFromDiscipline(row.discipline);
        map.set(row.competition_id, {
          category: row.group_name || row.category || 'Torneo privato',
          group_name: row.category || 'Partite',
          sport,
          region: row.region
        });
      });

      return map;
    }

    function isPrivateCompetition(match) {
      return match.competition_type === 'torneo_privato' || match.competition_type === 'partita_privata';
    }

    function resolveRegion(match, competitionMap) {
      const competition = competitionMap.get(match.competition_id) || {};
      return safe(match.region || competition.region, 'Italia');
    }

    function regionList(payload, matches, competitionMap) {
      const regions = [
        ...(payload.meta?.regions || []),
        ...(payload.competitions || []).map(competition => competition.region),
        ...matches.map(match => resolveRegion(match, competitionMap))
      ];

      return [...new Set(regions.filter(Boolean))]
        .sort((a, b) => {
          if (a === 'Italia') return 1;
          if (b === 'Italia') return -1;
          return a.localeCompare(b, 'it');
        });
    }

    function competitionLabel(match, competitionMap) {
      const competition = competitionMap.get(match.competition_id) || {};
      const category = safe(competition.category || match.category, 'Competizione');
      const group = safe(competition.group_name || match.group_name, '');
      const sport = formatDiscipline(competition.sport || match.sport);
      return `${sport} - ${category}${group && group !== '-' ? ' - ' + group : ''}`;
    }

    function groupArchivedMatches(matches, competitionMap, regions) {
      const groupedRegions = new Map();

      regions.forEach(region => {
        groupedRegions.set(region, {
          official: new Map(),
          private: new Map()
        });
      });

      matches.forEach(match => {
        const region = resolveRegion(match, competitionMap);
        const competition = competitionLabel(match, competitionMap);
        const regionGroup = groupedRegions.get(region) || {
          official: new Map(),
          private: new Map()
        };
        const target = isPrivateCompetition(match) ? regionGroup.private : regionGroup.official;

        if (!target.has(competition)) target.set(competition, []);
        target.get(competition).push(match);
        groupedRegions.set(region, regionGroup);
      });

      return [...groupedRegions.entries()];
    }

    function renderMatchRows(list, items) {
      items.forEach(match => {
        const row = document.createElement('article');
        row.className = 'match-row';
        row.innerHTML = `
          <div>
            <h3>${escapeHtml(safe(match.home_team, 'Squadra Casa'))} vs ${escapeHtml(safe(match.away_team, 'Squadra Ospite'))}</h3>
            <p>${escapeHtml(formatDate(match.match_date))}</p>
          </div>
          <div class="score-pill">${escapeHtml(normalizeScore(match.score))}</div>
        `;
        list.appendChild(row);
      });
    }

    function renderCompetitionBlock(content, competition, items, options = {}) {
      const competitionDetails = document.createElement('details');
      competitionDetails.className = 'archive-competition';
      if (options.open) competitionDetails.open = true;

      competitionDetails.innerHTML = `
        <summary class="competition-summary${options.private ? ' private' : ''}">
          <strong>${escapeHtml(competition)}</strong>
          <span>${items.length} partite</span>
        </summary>
        <div class="match-list"></div>
      `;

      renderMatchRows(competitionDetails.querySelector('.match-list'), items);
      content.appendChild(competitionDetails);
    }

    function renderArchive(matches, competitionMap, allRegions) {
      archiveRoot.innerHTML = '';

      if (!allRegions.length) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      const grouped = groupArchivedMatches(matches, competitionMap, allRegions);

      archivedMatchesCount.textContent = `${matches.length} partite`;
      const regionsWithMatches = grouped.filter(([, groups]) => {
        const officialCount = [...groups.official.values()].reduce((sum, items) => sum + items.length, 0);
        const privateCount = [...groups.private.values()].reduce((sum, items) => sum + items.length, 0);
        return officialCount + privateCount > 0;
      }).length;

      archivedRegionsCount.textContent = `${regionsWithMatches} regioni`;
      archivedCompetitionsCount.textContent = `${new Set(matches.map(match => match.competition_id || competitionLabel(match, competitionMap))).size} competizioni`;

      grouped.forEach(([region, groups], regionIndex) => {
        const officialEntries = [...groups.official.entries()].sort((a, b) => a[0].localeCompare(b[0], 'it'));
        const privateEntries = [...groups.private.entries()].sort((a, b) => a[0].localeCompare(b[0], 'it'));
        const regionMatchesCount = [...officialEntries, ...privateEntries].reduce((sum, [, items]) => sum + items.length, 0);
        const competitionsCount = officialEntries.length + privateEntries.length;
        const regionDetails = document.createElement('details');
        regionDetails.className = 'archive-region';
        if (regionIndex === 0 || regionMatchesCount > 0) regionDetails.open = regionIndex === 0;

        regionDetails.innerHTML = `
          <summary class="archive-summary">
            <strong>${escapeHtml(region)}</strong>
            <span>${competitionsCount} competizioni - ${regionMatchesCount} partite</span>
          </summary>
          <div class="archive-content"></div>
        `;

        const content = regionDetails.querySelector('.archive-content');

        officialEntries.forEach(([competition, items], competitionIndex) => {
          renderCompetitionBlock(content, competition, items, {
            open: regionIndex === 0 && competitionIndex === 0
          });
        });

        const privateDetails = document.createElement('details');
        privateDetails.className = 'archive-competition';
        if (!officialEntries.length && privateEntries.length) privateDetails.open = true;
        privateDetails.innerHTML = `
          <summary class="competition-summary private">
            <strong>Tornei privati</strong>
            <span>${privateEntries.reduce((sum, [, items]) => sum + items.length, 0)} partite</span>
          </summary>
          <div class="match-list"></div>
        `;

        const privateList = privateDetails.querySelector('.match-list');
        if (privateEntries.length) {
          privateEntries.forEach(([competition, items], index) => {
            renderCompetitionBlock(privateList, competition, items, {
              private: true,
              open: index === 0
            });
          });
        } else {
          privateList.innerHTML = '<div class="archive-note">Nessun torneo privato archiviato in questa regione.</div>';
        }
        content.appendChild(privateDetails);

        if (!officialEntries.length && !privateEntries.length) {
          content.insertAdjacentHTML('afterbegin', '<div class="archive-note">Nessuna partita archiviata in questa regione.</div>');
        }

        archiveRoot.appendChild(regionDetails);
      });
    }

    async function loadOfficialDataset() {
      const response = await fetch(OFFICIAL_DATA_URL, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`Dataset ufficiale non trovato: ${OFFICIAL_DATA_URL}`);
      }
      return response.json();
    }

    async function loadSupabaseRows() {
      const { data, error } = await supabaseClient
        .from('matches')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.warn('Partite Supabase non disponibili:', error.message);
        return [];
      }

      return data || [];
    }

    async function loadArchive() {
      archiveRoot.innerHTML = '';
      emptyState.style.display = 'block';
      emptyState.textContent = 'Caricamento archivio in corso...';

      try {
        const [payload, liveRows] = await Promise.all([
          loadOfficialDataset(),
          loadSupabaseRows()
        ]);

        const officialMatches = (payload.matches || []).map(officialMatchToCard);
        const competitionMap = buildCompetitionMap(payload.competitions || [], liveRows);
        const archivedMatches = mergeMatches(officialMatches, liveRows)
          .filter(isArchivedMatch)
          .map(match => ({
            ...match,
            region: resolveRegion(match, competitionMap),
            status: 'finished'
          }));
        const regions = regionList(payload, archivedMatches, competitionMap);

        emptyState.textContent = 'Nessuna partita archiviata al momento.';
        renderArchive(archivedMatches, competitionMap, regions);
      } catch (error) {
        emptyState.style.display = 'block';
        emptyState.innerHTML = `Errore nel caricamento dell’archivio: <strong>${escapeHtml(error.message)}</strong>`;
      }
    }

    loadArchive();</script><script src="https://cdn.iubenda.com/iubenda.js"></script></body></html>
