<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiveFut TV - Crea partita</title>
  <script src="https://app.termly.io/resource-blocker/ecfeb307-3d9a-4e26-a7de-4dab9c2345f9?autoBlock=on"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#060a0f;--bg2:#080d14;--bg3:#0a1018;--accent:#00c8ff;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.22);--text:#e8f4ff;--muted:#5a8aaa;--muted2:#3a5a6a;--radius:8px;--radius-lg:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    .container{width:min(1180px,calc(100% - 32px));margin:0 auto;}
    .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .page-bg svg{width:100%;height:100%;}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(6,10,15,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;}
    .logo-live{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;}
    .logo-fut{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#00c8ff;}
    .logo-tv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#00c8ff;font-style:italic;margin-left:2px;opacity:0.8;}
    .nav{display:flex;gap:14px;}
    .nav a{font-size:13px;font-weight:600;color:var(--muted);transition:color 0.2s;}
    .nav a:hover{color:#00c8ff;}
    .btn{display:inline-flex;align-items:center;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:8px 18px;border-radius:var(--radius);transition:all 0.2s;}
    .btn-primary{background:#00c8ff;color:#060a0f;}
    .btn-primary:hover{background:#22ddff;}
    .btn-secondary{background:transparent;color:#00c8ff;border:1px solid var(--border2);}
    main{position:relative;z-index:1;padding:32px 0 48px;}
    .page-tag{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px;}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:#fff;text-transform:uppercase;margin:0 0 6px;}
    p{font-size:13px;color:var(--muted);margin-bottom:20px;}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:680px;}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px;}
    .field{display:flex;flex-direction:column;gap:5px;}
    .field.full{grid-column:1/-1;}
    .field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
    .field input,.field select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:9px 12px;outline:none;transition:border-color 0.2s;}
    .field input:focus,.field select:focus{border-color:#00c8ff;}
    .field input::placeholder{color:var(--muted2);}
    .field select option{background:var(--bg3);}
    .field-note{font-size:11px;color:var(--muted2);margin-top:3px;}
    .status-msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);margin-top:12px;display:none;}
    .status-msg.show{display:block;}
    .status-msg.ok{background:rgba(0,200,100,0.1);color:#00cc66;border:1px solid rgba(0,200,100,0.2);}
    .status-msg.error{background:rgba(220,40,10,0.1);color:#ff5533;border:1px solid rgba(220,40,10,0.2);}
    footer{position:relative;z-index:1;text-align:center;padding:20px;font-size:12px;color:var(--muted2);border-top:1px solid var(--border);}
    footer a{color:var(--muted);}
    @media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="page-bg"><svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none"><defs><radialGradient id="gp"><stop offset="0%" stop-color="#00c8ff" stop-opacity="0.07"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="720" cy="450" rx="420" ry="270" fill="url(#gp)"/><rect x="120" y="60" width="1200" height="780" stroke="#00c8ff" stroke-width="1.5" opacity="0.06"/><line x1="720" y1="60" x2="720" y2="840" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><circle cx="720" cy="450" r="110" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="120" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="120" y="330" width="80" height="180" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="1100" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="1340" y="330" width="80" height="180" stroke="#00c8ff" stroke-width="1" opacity="0.05"/></svg></div>
<header class="topbar"><div class="container topbar-inner">
  <a href="dashboard.html"><span class="logo-live">LIVE</span><span class="logo-fut">FUT</span><span class="logo-tv">.TV</span></a>
  <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="live.html">Live</a></nav>
</div></header>
<main><div class="container">
  <div class="page-tag">Nuova partita</div>
  <h1>Crea una partita</h1>
  <p>Crea l'evento e apri subito lo studio diretta con l'attesa scelta.</p>
  <div class="card">
    <form id="matchForm">
      <div class="form-grid">
        <div class="field"><label>Squadra casa</label><input id="home_team" type="text" list="homeTeamsList" placeholder="Es. Virtus Marina" required><datalist id="homeTeamsList"></datalist></div>
        <div class="field"><label>Squadra ospite</label><input id="away_team" type="text" list="awayTeamsList" placeholder="Es. San Marco" required><datalist id="awayTeamsList"></datalist></div>
        <div class="field"><label>Disciplina</label>
          <select id="discipline" required>
            <option value="">Seleziona</option>
            <option value="Calcio a 11">Calcio a 11</option>
            <option value="Calcio a 5">Calcio a 5</option>
          </select>
        </div>
        <div class="field"><label>Categoria</label><select id="category"><option value="">Caricamento categorie...</option></select></div>
        <div class="field"><label>Regione</label><select id="region" required><option value="">Caricamento regioni...</option></select></div>
        <div class="field"><label>Campo</label><input id="field" type="text" placeholder="Es. Comunale Montesilvano" required></div>
        <div class="field full">
          <label>Torneo privato <span style="color:var(--muted2);font-weight:400">(opzionale)</span></label>
          <input id="private_tournament" type="text" list="privateTournamentsList" placeholder="Nome torneo, se presente">
          <datalist id="privateTournamentsList"></datalist>
          <div class="field-note">Lascia vuoto per una partita singola. Inserisci il nome di un torneo esistente per aggiungerla a quel gruppo.</div>
        </div>
        <div class="field full"><label>Quando vuoi andare in diretta?</label>
          <select id="broadcast_wait" required>
            <option value="0">Subito — vai in diretta ora</option>
            <option value="5">Tra 5 minuti</option>
            <option value="10">Tra 10 minuti</option>
            <option value="15">Tra 15 minuti</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="createMatchBtn">Crea partita</button>
    </form>
    <div id="matchStatus" class="status-msg"></div>
    <div style="margin-top:16px"><a class="btn btn-secondary" href="live.html">Vai alle live</a></div>
  </div>
</div></main>
<footer>&copy; 2026 LiveFut TV — <a href="https://www.iubenda.com/privacy-policy/71949704">Privacy</a> | <a href="terms.html">Termini</a></footer>
<script>
const SUPABASE_URL = 'https://obiiemjaxmgqeavrkxdc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaWllbWpheG1ncWVhdnJreGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDM2OTgsImV4cCI6MjA5MjUxOTY5OH0.m_dkQYPSrj70u1LFC11vOafaU1oN8P7G6AN_qHMr69k';
    const OFFICIAL_DATA_URL = 'data/italia_2025_26_api.json';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const pageParams = new URLSearchParams(window.location.search);
    const form = document.getElementById('matchForm');
    const statusBox = document.getElementById('statusBox');
    const regionSelect = document.getElementById('region');
    const categorySelect = document.getElementById('category');
    const disciplineSelect = document.getElementById('discipline');
    const homeTeamsList = document.getElementById('homeTeamsList');
    const awayTeamsList = document.getElementById('awayTeamsList');
    const privateTournamentInput = document.getElementById('private_tournament');
    const privateTournamentsList = document.getElementById('privateTournamentsList');

    const fallbackRegions = [
      'Abruzzo',
      'Piemonte VDA',
      'Veneto',
      'Lombardia',
      'Liguria',
      'Friuli Venezia Giulia',
      'Emilia Romagna',
      'Toscana',
      'Umbria',
      'Marche',
      'Lazio',
      'Molise',
      'Campania',
      'Puglia',
      'Basilicata',
      'Calabria',
      'Sicilia',
      'Sardegna',
      'Trento',
      'Bolzano'
    ];

    const fallbackCategories = [
      'Eccellenza',
      'Promozione',
      'Prima Categoria',
      'Seconda Categoria',
      'Terza Categoria',
      'Serie C1 Calcio a 5',
      'Serie C2 Calcio a 5',
      'Under 19',
      'Under 17',
      'Under 15',
      'Femminile',
      'Coppa'
    ];

    let officialCompetitions = [];
    let officialTeams = [];
    let privateTournaments = [];
    let currentUser = null;
    let preselectedTournamentId = pageParams.get('competition_id') || '';
    let preselectedTournamentName = pageParams.get('tournament_name') || '';
    let preselectedTournamentRegion = pageParams.get('region') || '';

    function showStatus(message, type = 'ok') {
      statusBox.textContent = message;
      statusBox.className = `status show ${type}`;
    }

    function formatDiscipline(value) {
      if (value === 'calcio_a_11') return 'Calcio a 11';
      if (value === 'calcio_a_5') return 'Calcio a 5';
      return value || 'Disciplina non specificata';
    }

    function uniqueSorted(values) {
      return [...new Set(values.filter(Boolean))]
        .sort((a, b) => String(a).localeCompare(String(b), 'it'));
    }

    function slugify(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 80);
    }

    function privateTournamentId(region, name) {
      const ownerKey = slugify(currentUser?.id || 'utente');
      return `privato_${ownerKey}_${slugify(region || 'italia')}_${slugify(name)}`;
    }

    function findPrivateTournament(region, name) {
      const normalizedName = String(name || '').trim().toLowerCase();
      const normalizedRegion = String(region || '').trim().toLowerCase();

      return privateTournaments.find(tournament => {
        return String(tournament.group_name || '').trim().toLowerCase() === normalizedName
          && String(tournament.region || '').trim().toLowerCase() === normalizedRegion;
      });
    }

    function applyTournamentPrefill() {
      if (preselectedTournamentRegion && [...regionSelect.options].some(option => option.value === preselectedTournamentRegion)) {
        regionSelect.value = preselectedTournamentRegion;
        refreshCategories();
        refreshTeamSuggestions();
      }

      if (preselectedTournamentName) {
        privateTournamentInput.value = preselectedTournamentName;
      }
    }

    function populateSelect(select, values, placeholder) {
      select.innerHTML = '';

      const emptyOption = document.createElement('option');
      emptyOption.value = '';
      emptyOption.textContent = placeholder;
      select.appendChild(emptyOption);

      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function isValidCategory(value) {
      const text = String(value || '').trim();
      const upper = text.toUpperCase();

      if (!text || text.length > 58) return false;
      if (upper.includes('.PDF')) return false;
      if (upper.includes('CLASSIFICA')) return false;
      if (upper.includes('COMUNICATO')) return false;
      if (upper.includes('COMUNICAZIONE')) return false;
      if (upper.includes('CONVOCAZIONE')) return false;
      if (upper.includes('RAPPRESENTATIVA')) return false;
      if (upper.includes('PROGRAMMA')) return false;
      if (upper.includes('PROGRAMMI')) return false;
      if (upper.includes('RECUPERI')) return false;
      if (upper.includes('RISULTATI')) return false;
      if (upper.startsWith('COMUFF')) return false;
      if (upper.startsWith('COM_')) return false;
      if (upper.startsWith('C.U.')) return false;
      if (upper.startsWith('CU_')) return false;
      if (upper.startsWith('ALLEGCOM')) return false;
      if (upper.startsWith('AVVISO')) return false;
      if (upper.startsWith('APP GARE')) return false;
      if (upper.startsWith('CALENDARI')) return false;
      if (upper.startsWith('CALENDARIO')) return false;

      return /ECCELLENZA|PROMOZIONE|PRIMA|SECONDA|TERZA|JUNIORES|UNDER|ALLIEVI|GIOVANISSIMI|SERIE|COPPA|FEMMINILE|AMATORI|ELITE|REGIONALE|U[0-9]{2}|CALCIO A 5|C1|C2/.test(upper);
    }

    function buildOfficialTeams(payload) {
      const competitionsById = new Map((payload.competitions || []).map(item => [item.competition_id, item]));
      const teamsById = new Map();

      (payload.teams || []).forEach(team => {
        if (!team.team_id || !team.name) return;
        teamsById.set(team.team_id, {
          team_id: team.team_id,
          name: team.name,
          region: team.region || '',
          sports: new Set(),
          categories: new Set()
        });
      });

      (payload.matches || []).forEach(match => {
        const competition = competitionsById.get(match.competition_id) || {};

        [
          { id: match.home_team_id, name: match.home_team },
          { id: match.away_team_id, name: match.away_team }
        ].forEach(team => {
          if (!team.id || !team.name) return;

          if (!teamsById.has(team.id)) {
            teamsById.set(team.id, {
              team_id: team.id,
              name: team.name,
              region: match.region || competition.region || '',
              sports: new Set(),
              categories: new Set()
            });
          }

          const storedTeam = teamsById.get(team.id);
          if (!storedTeam.region && (match.region || competition.region)) {
            storedTeam.region = match.region || competition.region;
          }
          if (match.sport || competition.sport) storedTeam.sports.add(match.sport || competition.sport);
          if (isValidCategory(match.category || competition.category)) {
            storedTeam.categories.add(match.category || competition.category);
          }
        });
      });

      return Array.from(teamsById.values())
        .map(team => ({
          ...team,
          sports: Array.from(team.sports),
          categories: Array.from(team.categories)
        }))
        .sort((a, b) => a.name.localeCompare(b.name, 'it'));
    }

    function refreshCategories() {
      const selectedRegion = regionSelect.value;
      const selectedDiscipline = disciplineSelect.value;
      const currentCategory = categorySelect.value;

      const categories = uniqueSorted([
        ...fallbackCategories,
        ...officialCompetitions
          .filter(competition => !selectedRegion || competition.region === selectedRegion)
          .filter(competition => !selectedDiscipline || formatDiscipline(competition.sport) === selectedDiscipline)
          .map(competition => competition.category)
          .filter(isValidCategory)
      ]);

      populateSelect(categorySelect, categories.length ? categories : fallbackCategories, 'Seleziona categoria, se utile');

      if (currentCategory && categories.includes(currentCategory)) {
        categorySelect.value = currentCategory;
      }
    }

    function refreshTeamSuggestions() {
      const selectedRegion = regionSelect.value;
      const selectedDiscipline = disciplineSelect.value;
      const selectedCategory = categorySelect.value;

      const filteredTeams = officialTeams
        .filter(team => !selectedRegion || team.region === selectedRegion)
        .filter(team => !selectedDiscipline || team.sports.some(sport => formatDiscipline(sport) === selectedDiscipline))
        .filter(team => !selectedCategory || team.categories.includes(selectedCategory))
        .slice(0, 500);

      homeTeamsList.innerHTML = '';
      awayTeamsList.innerHTML = '';

      filteredTeams.forEach(team => {
        const labelParts = [
          team.region,
          team.sports.map(formatDiscipline).join(', '),
          team.categories.slice(0, 2).join(' / ')
        ].filter(Boolean);

        [homeTeamsList, awayTeamsList].forEach(list => {
          const option = document.createElement('option');
          option.value = team.name;
          option.label = labelParts.join(' - ');
          list.appendChild(option);
        });
      });
    }

    async function loadOfficialOptions() {
      try {
        const response = await fetch(OFFICIAL_DATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('Dataset ufficiale non disponibile.');

        const payload = await response.json();
        officialCompetitions = payload.competitions || [];
        officialTeams = buildOfficialTeams(payload);

        const regions = uniqueSorted([
          ...(payload.meta?.regions || []),
          ...officialCompetitions.map(competition => competition.region),
          ...officialTeams.map(team => team.region)
        ]);

        const disciplines = uniqueSorted(
          officialCompetitions
            .map(competition => formatDiscipline(competition.sport))
            .filter(Boolean)
        );

        populateSelect(regionSelect, regions.length ? regions : fallbackRegions, 'Seleziona');
        populateSelect(disciplineSelect, disciplines.length ? disciplines : ['Calcio a 11', 'Calcio a 5'], 'Seleziona');
        refreshCategories();
        refreshTeamSuggestions();
      } catch (error) {
        populateSelect(regionSelect, fallbackRegions, 'Seleziona');
        populateSelect(categorySelect, fallbackCategories, 'Seleziona categoria, se utile');
        populateSelect(disciplineSelect, ['Calcio a 11', 'Calcio a 5'], 'Seleziona');
        showStatus('Dataset ufficiale non raggiungibile. Puoi comunque creare la partita con le opzioni base.', 'error');
      }
    }

    async function loadPrivateTournaments() {
      const { data, error } = await supabaseClient
        .from('matches')
        .select('competition_id, competition_type, group_name, region, broadcaster_id')
        .not('competition_id', 'is', null)
        .eq('broadcaster_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        privateTournaments = [];
        return;
      }

      const byId = new Map();

      (data || []).forEach(row => {
        if (!row.competition_id || !row.group_name) return;
        if (row.competition_type !== 'torneo_privato') return;
        if (!byId.has(row.competition_id)) {
          byId.set(row.competition_id, {
            competition_id: row.competition_id,
            group_name: row.group_name,
            region: row.region || ''
          });
        }
      });

      privateTournaments = Array.from(byId.values())
        .sort((a, b) => a.group_name.localeCompare(b.group_name, 'it'));

      privateTournamentsList.innerHTML = '';
      privateTournaments.forEach(tournament => {
        const option = document.createElement('option');
        option.value = tournament.group_name;
        option.label = tournament.region || 'Torneo privato';
        privateTournamentsList.appendChild(option);
      });
    }

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html';
        return false;
      }

      currentUser = session.user;
      return true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      const region = document.getElementById('region').value;
      const category = document.getElementById('category').value;
      const tournamentName = privateTournamentInput.value.trim();
      const tournament = tournamentName ? findPrivateTournament(region, tournamentName) : null;
      const usePreselectedTournament = preselectedTournamentId
        && tournamentName === preselectedTournamentName
        && region === preselectedTournamentRegion;
      const competitionId = tournamentName
        ? (usePreselectedTournament ? preselectedTournamentId : tournament?.competition_id || privateTournamentId(region, tournamentName))
        : null;

      const payload = {
        home_team: document.getElementById('home_team').value.trim(),
        away_team: document.getElementById('away_team').value.trim(),
        discipline: document.getElementById('discipline').value,
        category: category || null,
        region,
        field: document.getElementById('field').value.trim(),
        score: '0-0',
        minute: 0,
        status: 'soon',
        broadcaster_id: session.user.id,
        competition_id: competitionId,
        competition_type: tournamentName ? 'torneo_privato' : 'partita_privata',
        group_name: tournamentName || null,
        source: 'supabase'
      };

      const waitMinutes = Number(document.getElementById('broadcast_wait').value || 0);

      const { data, error } = await supabaseClient
        .from('matches')
        .insert([payload])
        .select('id')
        .single();

      if (error) {
        showStatus('Errore durante la creazione della partita: ' + error.message, 'error');
        return;
      }

      showStatus('Partita creata con successo. Apertura dello studio diretta...', 'ok');

      setTimeout(() => {
        const studioParams = new URLSearchParams({
          id: data.id,
          wait: String(waitMinutes),
          autostart: waitMinutes === 0 ? '1' : '0'
        });
        window.location.href = `studio.html?${studioParams.toString()}`;
      }, 900);
    });

    regionSelect.addEventListener('change', () => {
      refreshCategories();
      refreshTeamSuggestions();
    });

    disciplineSelect.addEventListener('change', () => {
      refreshCategories();
      refreshTeamSuggestions();
    });

    categorySelect.addEventListener('change', refreshTeamSuggestions);

    async function initPage() {
      const isAuthenticated = await checkSession();
      if (!isAuthenticated) return;
      await Promise.all([
        loadOfficialOptions(),
        loadPrivateTournaments()
      ]);
      applyTournamentPrefill();
    }

    initPage();</script><script src="https://cdn.iubenda.com/iubenda.js"></script></body></html>
