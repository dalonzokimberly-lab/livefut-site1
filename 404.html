<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiveFut TV - Pagina non trovata</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060a0f;--accent:#00c8ff;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.22);--text:#e8f4ff;--muted:#5a8aaa;--muted2:#3a5a6a;--radius:8px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}

    .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .page-bg svg{width:100%;height:100%;}

    .content{position:relative;z-index:1;text-align:center;padding:40px 24px;max-width:480px;}

    .logo{margin-bottom:32px;}
    .logo-live{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#fff;}
    .logo-fut{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;color:#00c8ff;}
    .logo-tv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:#00c8ff;font-style:italic;margin-left:2px;opacity:0.8;}

    .code{font-family:'Barlow Condensed',sans-serif;font-size:clamp(80px,20vw,120px);font-weight:900;color:#00c8ff;line-height:1;opacity:0.15;margin-bottom:-20px;letter-spacing:-4px;}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:#fff;text-transform:uppercase;margin-bottom:10px;letter-spacing:-0.5px;}
    p{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:28px;}

    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:10px 22px;border-radius:var(--radius);transition:all 0.2s;}
    .btn-primary{background:#00c8ff;color:#060a0f;}
    .btn-primary:hover{background:#22ddff;}
    .btn-secondary{background:transparent;color:#00c8ff;border:1px solid var(--border2);}
    .btn-secondary:hover{background:rgba(0,200,255,0.07);}

    .field-lines{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;opacity:0.06;}
  </style>
</head>
<body>
<div class="page-bg">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
    <defs><radialGradient id="gp"><stop offset="0%" stop-color="#00c8ff" stop-opacity="0.10"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="720" cy="450" rx="380" ry="250" fill="url(#gp)"/>
    <rect x="120" y="60" width="1200" height="780" stroke="#00c8ff" stroke-width="1.5" opacity="0.08"/>
    <line x1="720" y1="60" x2="720" y2="840" stroke="#00c8ff" stroke-width="1" opacity="0.07"/>
    <circle cx="720" cy="450" r="110" stroke="#00c8ff" stroke-width="1" opacity="0.07"/>
    <circle cx="720" cy="450" r="4" fill="#00c8ff" opacity="0.15"/>
    <rect x="120" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.06"/>
    <rect x="1100" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.06"/>
    <rect x="94" y="390" width="26" height="120" stroke="#00c8ff" stroke-width="1" opacity="0.05"/>
    <rect x="1320" y="390" width="26" height="120" stroke="#00c8ff" stroke-width="1" opacity="0.05"/>
  </svg>
</div>

<div class="content">
  <div class="logo">
    <a href="index.html">
      <span class="logo-live">LIVE</span><span class="logo-fut">FUT</span><span class="logo-tv">.TV</span>
    </a>
  </div>

  <div class="code">404</div>
  <h1>Pagina non trovata</h1>
  <p>La pagina che cerchi non esiste o è stata spostata.<br>Torna alla home per riprendere da dove eri.</p>

  <div class="btns">
    <a class="btn btn-primary" href="index.html">Torna alla home</a>
    <a class="btn btn-secondary" href="live.html">Guarda le live</a>
  </div>
</div>
</body>
</html>
