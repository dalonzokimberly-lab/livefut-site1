<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiveFut TV - I miei tornei</title>
  <script src="https://app.termly.io/resource-blocker/ecfeb307-3d9a-4e26-a7de-4dab9c2345f9?autoBlock=on"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#060a0f;--bg2:#080d14;--bg3:#0a1018;--accent:#00c8ff;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.22);--text:#e8f4ff;--muted:#5a8aaa;--muted2:#3a5a6a;--radius:8px;--radius-lg:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
    a{color:inherit;text-decoration:none;}
    .container{width:min(1180px,calc(100% - 32px));margin:0 auto;}
    .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .page-bg svg{width:100%;height:100%;}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(6,10,15,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap;}
    .logo-live{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;}
    .logo-fut{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#00c8ff;}
    .logo-tv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#00c8ff;font-style:italic;margin-left:2px;opacity:0.8;}
    .nav{display:flex;gap:14px;flex-wrap:wrap;}
    .nav a{font-size:13px;font-weight:600;color:var(--muted);transition:color 0.2s;}
    .nav a:hover{color:#00c8ff;}
    .actions{display:flex;gap:8px;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:8px 16px;border-radius:var(--radius);transition:all 0.2s;}
    .btn-primary{background:#00c8ff;color:#060a0f;}
    .btn-secondary{background:transparent;color:#00c8ff;border:1px solid var(--border2);}
    .btn-danger{background:rgba(220,40,10,0.1);color:#ff5533;border:1px solid rgba(220,40,10,0.25);}
    main{position:relative;z-index:1;padding:32px 0 48px;}
    .page-tag{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px;}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:#fff;text-transform:uppercase;margin:0 0 6px;}
    p{font-size:13px;color:var(--muted);margin-bottom:20px;}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:24px;}
    .stat{padding:16px;text-align:center;border-right:1px solid var(--border);}
    .stat:last-child{border-right:none;}
    .stat strong{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:#00c8ff;display:block;}
    .stat span{font-size:11px;color:var(--muted);letter-spacing:0.5px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;}
    .card.empty{color:var(--muted2);font-size:13px;text-align:center;padding:32px;border-style:dashed;}
    .card h3{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#fff;text-transform:uppercase;margin:0 0 8px;}
    .card p{font-size:13px;color:var(--muted);margin-bottom:10px;}
    .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;}
    .tag-live{background:rgba(220,40,10,0.15);color:#ff5533;border:1px solid rgba(220,40,10,0.3);}
    .tag-ok{background:rgba(0,200,100,0.1);color:#00cc66;border:1px solid rgba(0,200,100,0.2);}
    .status-msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);margin-bottom:16px;display:none;}
    .status-msg.show{display:block;}
    footer{position:relative;z-index:1;text-align:center;padding:20px;font-size:12px;color:var(--muted2);border-top:1px solid var(--border);}
    footer a{color:var(--muted);}
    @media(max-width:820px){.nav{display:none;}.stats-row{grid-template-columns:1fr 1fr;}}
  </style>
</head>
<body>
<div class="page-bg"><svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none"><defs><radialGradient id="gp"><stop offset="0%" stop-color="#00c8ff" stop-opacity="0.07"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="720" cy="450" rx="420" ry="270" fill="url(#gp)"/><rect x="120" y="60" width="1200" height="780" stroke="#00c8ff" stroke-width="1.5" opacity="0.06"/><line x1="720" y1="60" x2="720" y2="840" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><circle cx="720" cy="450" r="110" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="120" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="1100" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/></svg></div>
<header class="topbar"><div class="container topbar-inner">
  <a href="index.html"><span class="logo-live">LIVE</span><span class="logo-fut">FUT</span><span class="logo-tv">.TV</span></a>
  <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="create-match.html">Crea partita</a><a href="live.html">Live</a></nav>
  <div class="actions">
    <a class="btn btn-primary" href="create-match.html">Nuovo torneo o partita</a>
    <button class="btn btn-danger" id="logoutBtn">Esci</button>
  </div>
</div></header>
<main><div class="container">
  <div class="page-tag">Tornei privati</div>
  <h1>I miei tornei</h1>
  <p>Gestisci i tornei privati collegati al tuo account e aggiungi nuove partite allo stesso evento.</p>
  <div id="pageMessage" class="status-msg"></div>
  <div class="stats-row">
    <div class="stat"><strong id="totalTournaments">0</strong><span>Tornei privati</span></div>
    <div class="stat"><strong id="activeTournaments">0</strong><span>Tornei attivi</span></div>
    <div class="stat"><strong id="totalMatches">0</strong><span>Partite create</span></div>
  </div>
  <div class="grid" id="tournamentsGrid">
    <div class="card empty">Caricamento tornei...</div>
  </div>
</div></main>
<footer>&copy; 2026 LiveFut TV — <a href="https://www.iubenda.com/privacy-policy/71949704">Privacy</a> | <a href="terms.html">Termini</a></footer>
<script>
const SUPABASE_URL = 'https://obiiemjaxmgqeavrkxdc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaWllbWpheG1ncWVhdnJreGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDM2OTgsImV4cCI6MjA5MjUxOTY5OH0.m_dkQYPSrj70u1LFC11vOafaU1oN8P7G6AN_qHMr69k';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const grid = document.getElementById('tournamentsGrid');
    const pageMessage = document.getElementById('pageMessage');

    let currentUser = null;
    let tournamentRows = [];

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safe(value, fallback = '-') {
      return value === null || value === undefined || value === '' ? fallback : value;
    }

    function showMessage(message, type = 'ok') {
      pageMessage.textContent = message;
      pageMessage.className = type === 'error'
        ? 'status-message show error'
        : 'status-message show';
    }

    function statusLabel(status) {
      if (status === 'live') return 'Live';
      if (status === 'soon') return 'In arrivo';
      if (status === 'finished') return 'Conclusa';
      return safe(status, 'In arrivo');
    }

    function formatDiscipline(value) {
      if (value === 'calcio_a_11') return 'Calcio a 11';
      if (value === 'calcio_a_5') return 'Calcio a 5';
      return safe(value, 'Disciplina');
    }

    function tournamentStatus(matches) {
      return matches.every(match => match.source === 'archived') ? 'archived' : 'active';
    }

    function groupTournaments(rows) {
      const byId = new Map();

      rows.forEach(row => {
        if (!row.competition_id || !row.group_name) return;
        if (row.competition_type !== 'torneo_privato') return;

        if (!byId.has(row.competition_id)) {
          byId.set(row.competition_id, {
            competition_id: row.competition_id,
            name: row.group_name,
            region: row.region || 'Non specificata',
            discipline: row.discipline || 'Calcio',
            category: row.category || '',
            matches: []
          });
        }

        byId.get(row.competition_id).matches.push(row);
      });

      return Array.from(byId.values())
        .sort((a, b) => a.name.localeCompare(b.name, 'it'));
    }

    function createMatchUrl(match, mode = 'view') {
      const params = new URLSearchParams({
        id: match.id || '',
        match_id: match.match_id || '',
        competition_id: match.competition_id || '',
        mode
      });
      return `match.html?${params.toString()}`;
    }

    function createTournamentMatchUrl(tournament) {
      const params = new URLSearchParams({
        competition_id: tournament.competition_id,
        tournament_name: tournament.name,
        region: tournament.region
      });
      return `create-match.html?${params.toString()}`;
    }

    function renderStats(tournaments) {
      document.getElementById('totalTournaments').textContent = tournaments.length;
      document.getElementById('activeTournaments').textContent = tournaments.filter(item => tournamentStatus(item.matches) !== 'archived').length;
      document.getElementById('totalMatches').textContent = tournaments.reduce((total, item) => total + item.matches.length, 0);
    }

    function renderTournaments() {
      const tournaments = groupTournaments(tournamentRows);
      renderStats(tournaments);

      if (!tournaments.length) {
        grid.innerHTML = `
          <article class="card empty">
            <h2>Nessun torneo privato</h2>
            <p>Crea una partita e compila il campo Torneo privato per iniziare a gestire un evento custom.</p>
          </article>
        `;
        return;
      }

      grid.innerHTML = '';

      tournaments.forEach(tournament => {
        const archived = tournamentStatus(tournament.matches) === 'archived';
        const activeMatches = tournament.matches.filter(match => match.source !== 'archived').length;
        const matchesMarkup = tournament.matches
          .slice()
          .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))
          .map(match => `
            <div class="match-item">
              <div>
                <strong>${escapeHtml(safe(match.home_team, 'Squadra Casa'))} vs ${escapeHtml(safe(match.away_team, 'Squadra Ospite'))}</strong>
                <span>${escapeHtml(statusLabel(match.status))}${match.category ? ' - ' + escapeHtml(match.category) : ''}</span>
              </div>
              <div class="actions">
                <a class="btn btn-secondary" href="${createMatchUrl(match, 'view')}">Scheda</a>
                ${match.source !== 'archived' ? `<a class="btn btn-primary" href="${createMatchUrl(match, 'broadcast')}">Studio</a>` : ''}
              </div>
            </div>
          `)
          .join('');

        const card = document.createElement('article');
        card.className = 'card tournament-card';
        card.innerHTML = `
          <div class="tournament-head">
            <div>
              <h3>${escapeHtml(tournament.name)}</h3>
              <p>${escapeHtml(tournament.region)} - ${escapeHtml(formatDiscipline(tournament.discipline))}</p>
            </div>
            <span class="badge ${archived ? 'archived' : ''}">${archived ? 'Archiviato' : 'Attivo'}</span>
          </div>

          <div class="meta-row">
            <div class="meta-item">
              <strong>Partite</strong>
              <span>${tournament.matches.length}</span>
            </div>
            <div class="meta-item">
              <strong>Visibili</strong>
              <span>${activeMatches}</span>
            </div>
            <div class="meta-item">
              <strong>Categoria</strong>
              <span>${escapeHtml(safe(tournament.category, 'Libera'))}</span>
            </div>
          </div>

          <div class="actions">
            <a class="btn btn-primary" href="${createTournamentMatchUrl(tournament)}">Aggiungi partita</a>
            ${archived
              ? `<button class="btn btn-secondary" type="button" data-action="restore" data-id="${escapeHtml(tournament.competition_id)}">Ripristina</button>`
              : `<button class="btn btn-danger" type="button" data-action="archive" data-id="${escapeHtml(tournament.competition_id)}">Archivia torneo</button>`}
          </div>

          <div class="match-list">
            ${matchesMarkup}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function loadTournaments() {
      const { data, error } = await supabaseClient
        .from('matches')
        .select('*')
        .eq('broadcaster_id', currentUser.id)
        .eq('competition_type', 'torneo_privato')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = '<article class="card empty">Errore nel caricamento dei tornei.</article>';
        showMessage(`Errore Supabase: ${error.message}`, 'error');
        return;
      }

      tournamentRows = data || [];
      renderTournaments();
    }

    async function updateTournamentArchive(competitionId, archived) {
      const { error } = await supabaseClient
        .from('matches')
        .update({ source: archived ? 'archived' : 'supabase' })
        .eq('broadcaster_id', currentUser.id)
        .eq('competition_id', competitionId);

      if (error) {
        showMessage(`Errore durante l'aggiornamento del torneo: ${error.message}`, 'error');
        return;
      }

      showMessage(archived ? 'Torneo archiviato.' : 'Torneo ripristinato.');
      await loadTournaments();
    }

    async function requireUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html?redirect=tournaments.html';
        return false;
      }

      currentUser = session.user;
      return true;
    }

    grid.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;

      const action = button.dataset.action;
      const competitionId = button.dataset.id;

      if (action === 'archive') {
        updateTournamentArchive(competitionId, true);
      }

      if (action === 'restore') {
        updateTournamentArchive(competitionId, false);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    async function initPage() {
      const isAuthenticated = await requireUser();
      if (!isAuthenticated) return;
      await loadTournaments();
    }

    initPage();</script><script src="https://cdn.iubenda.com/iubenda.js"></script></body></html>
