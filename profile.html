<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiveFut TV - Profilo</title>
  <script src="https://app.termly.io/resource-blocker/ecfeb307-3d9a-4e26-a7de-4dab9c2345f9?autoBlock=on"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#060a0f;--bg2:#080d14;--bg3:#0a1018;--accent:#00c8ff;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.22);--text:#e8f4ff;--muted:#5a8aaa;--muted2:#3a5a6a;--radius:8px;--radius-lg:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    .container{width:min(1180px,calc(100% - 32px));margin:0 auto;}
    .page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .page-bg svg{width:100%;height:100%;}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(6,10,15,0.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;}
    .logo-live{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;}
    .logo-fut{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#00c8ff;}
    .logo-tv{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#00c8ff;font-style:italic;margin-left:2px;opacity:0.8;}
    .actions{display:flex;gap:8px;}
    .btn{display:inline-flex;align-items:center;border:none;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:8px 16px;border-radius:var(--radius);transition:all 0.2s;}
    .btn-primary{background:#00c8ff;color:#060a0f;}
    .btn-secondary{background:transparent;color:#00c8ff;border:1px solid var(--border2);}
    .btn-danger{background:rgba(220,40,10,0.1);color:#ff5533;border:1px solid rgba(220,40,10,0.25);}
    main{position:relative;z-index:1;padding:32px 0 48px;}
    .page-tag{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px;}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:#fff;text-transform:uppercase;margin:0 0 6px;}
    h2{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#fff;text-transform:uppercase;margin:0 0 14px;}
    p{font-size:13px;color:var(--muted);margin-bottom:16px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
    .form-group{margin-bottom:12px;}
    .form-group label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;}
    .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:9px 12px;outline:none;transition:border-color 0.2s;}
    .form-group input:focus,.form-group select:focus{border-color:#00c8ff;}
    .form-group textarea{min-height:80px;resize:vertical;}
    .profile-preview{display:grid;gap:8px;}
    .preview-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .preview-item:last-child{border-bottom:none;}
    .preview-item strong{color:var(--muted);font-weight:600;font-size:12px;}
    .status-msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);margin-top:10px;display:none;}
    .status-msg.show{display:block;}
    .status-msg.ok{background:rgba(0,200,100,0.1);color:#00cc66;border:1px solid rgba(0,200,100,0.2);}
    .status-msg.error{background:rgba(220,40,10,0.1);color:#ff5533;border:1px solid rgba(220,40,10,0.2);}
    footer{position:relative;z-index:1;text-align:center;padding:20px;font-size:12px;color:var(--muted2);border-top:1px solid var(--border);}
    footer a{color:var(--muted);}
    @media(max-width:820px){.grid2{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="page-bg"><svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none"><defs><radialGradient id="gp"><stop offset="0%" stop-color="#00c8ff" stop-opacity="0.07"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="720" cy="450" rx="420" ry="270" fill="url(#gp)"/><rect x="120" y="60" width="1200" height="780" stroke="#00c8ff" stroke-width="1.5" opacity="0.06"/><line x1="720" y1="60" x2="720" y2="840" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><circle cx="720" cy="450" r="110" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="120" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="120" y="330" width="80" height="180" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="1100" y="240" width="220" height="360" stroke="#00c8ff" stroke-width="1" opacity="0.05"/><rect x="1340" y="330" width="80" height="180" stroke="#00c8ff" stroke-width="1" opacity="0.05"/></svg></div>
<header class="topbar"><div class="container topbar-inner">
  <a href="index.html"><span class="logo-live">LIVE</span><span class="logo-fut">FUT</span><span class="logo-tv">.TV</span></a>
  <div class="actions">
    <a class="btn btn-secondary" href="dashboard.html">Dashboard</a>
    <button class="btn btn-danger" id="logoutBtn">Esci</button>
  </div>
</div></header>
<main><div class="container">
  <div class="page-tag">Configurazione profilo</div>
  <h1>Completa il tuo profilo</h1>
  <p>Imposta username, dati personali e le informazioni mostrate nella dashboard.</p>
  <div class="grid2">
    <div>
      <div class="card">
        <h2>Dati profilo</h2>
        <div class="form-group"><label>Nome profilo</label><input id="displayName" type="text" placeholder="Il tuo nome"/></div>
        <div class="form-group"><label>Username</label><input id="username" type="text" placeholder="username"/></div>
        <div class="form-group"><label>Nome</label><input id="firstName" type="text" placeholder="Nome"/></div>
        <div class="form-group"><label>Cognome</label><input id="lastName" type="text" placeholder="Cognome"/></div>
        <div class="form-group"><label>Data di nascita</label><input id="birthDate" type="date"/></div>
        <div class="form-group"><label>Città</label><input id="city" type="text" placeholder="Città"/></div>
        <div class="form-group"><label>Squadra del cuore</label><input id="favoriteTeam" type="text" placeholder="Es. Napoli FC"/></div>
        <div class="form-group"><label>Ruolo</label><input id="role" type="text" placeholder="Es. Broadcaster"/></div>
        <div class="form-group"><label>Bio</label><textarea id="bio" placeholder="Breve presentazione"></textarea></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" id="saveProfileBtn">Salva profilo</button>
          <button class="btn btn-secondary" id="reloadProfileBtn">Ricarica dati</button>
        </div>
        <div id="profileStatus" class="status-msg"></div>
      </div>
    </div>
    <div class="card">
      <h2>Anteprima profilo</h2>
      <div class="profile-preview">
        <div class="preview-item"><strong>Nome profilo</strong><span id="previewDisplayName">—</span></div>
        <div class="preview-item"><strong>Username</strong><span id="previewUsername">—</span></div>
        <div class="preview-item"><strong>Email</strong><span id="previewEmail">—</span></div>
        <div class="preview-item"><strong>Squadra del cuore</strong><span id="previewFavoriteTeam">—</span></div>
        <div class="preview-item"><strong>Città</strong><span id="previewCity">—</span></div>
        <div class="preview-item"><strong>Bio</strong><span id="previewBio">—</span></div>
      </div>
    </div>
  </div>
</div></main>
<footer>&copy; 2026 LiveFut TV — <a href="https://www.iubenda.com/privacy-policy/71949704">Privacy</a> | <a href="terms.html">Termini</a></footer>
<script>
const SUPABASE_URL = 'https://obiiemjaxmgqeavrkxdc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iaWllbWpheG1ncWVhdnJreGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDM2OTgsImV4cCI6MjA5MjUxOTY5OH0.m_dkQYPSrj70u1LFC11vOafaU1oN8P7G6AN_qHMr69k';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let currentProfile = null;

    function showProfileStatus(message, type = 'ok') {
      const box = document.getElementById('profileStatus');
      box.textContent = message;
      box.className = `status-box show ${type}`;
    }

    function fillProfile(profile, fallbackEmail = '') {
      document.getElementById('display_name').value = profile?.display_name || '';
      document.getElementById('username').value = profile?.username || '';
      document.getElementById('first_name').value = profile?.first_name || '';
      document.getElementById('last_name').value = profile?.last_name || '';
      document.getElementById('birth_date').value = profile?.birth_date || '';
      document.getElementById('city').value = profile?.city || '';
      document.getElementById('favorite_team').value = profile?.favorite_team || '';
      document.getElementById('bio').value = profile?.bio || '';
      document.getElementById('role_readonly').value = profile?.role || 'user';

      document.getElementById('previewDisplayName').textContent = profile?.display_name || '-';
      document.getElementById('previewUsername').textContent = profile?.username || '-';
      document.getElementById('previewEmail').textContent = fallbackEmail || '-';
      document.getElementById('previewFavoriteTeam').textContent = profile?.favorite_team || '-';
      document.getElementById('previewCity').textContent = profile?.city || '-';
      document.getElementById('previewBio').textContent = profile?.bio || '-';
    }

    async function loadProfile() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = session.user;

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (!error && profile) {
        currentProfile = profile;
        fillProfile(profile, currentUser.email || '-');
      } else {
        fillProfile({ role: 'user' }, currentUser.email || '-');
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!currentUser) {
        showProfileStatus('Utente non autenticato.', 'error');
        return;
      }

      const payload = {
        id: currentUser.id,
        email: currentUser.email,
        display_name: document.getElementById('display_name').value.trim(),
        username: document.getElementById('username').value.trim(),
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        birth_date: document.getElementById('birth_date').value || null,
        city: document.getElementById('city').value.trim(),
        favorite_team: document.getElementById('favorite_team').value.trim(),
        bio: document.getElementById('bio').value.trim()
      };

      const { data, error } = await supabaseClient
        .from('profiles')
        .upsert(payload)
        .select()
        .single();

      if (error) {
        showProfileStatus('Errore durante il salvataggio del profilo: ' + error.message, 'error');
        return;
      }

      currentProfile = data;
      fillProfile(data, currentUser.email || '-');
      showProfileStatus('Profilo aggiornato con successo.', 'ok');
    });

    document.getElementById('reloadProfileBtn').addEventListener('click', async () => {
      await loadProfile();
      showProfileStatus('Dati profilo ricaricati.', 'ok');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    loadProfile();</script><script src="https://cdn.iubenda.com/iubenda.js"></script></body></html>
